# EAGLE-V run configuration (8x H100, ~1 day). Paths are relative to this file.
# Question: when a VLM judge is unsure, are the two candidates CLOSE (aleatoric: humans tie / split) or can the judge
# NOT TELL (epistemic)? And is this where VLM judges lag text LLM judges?
paths:
  data: data          # items/*.jsonl + images/ (shipped in the pack)
  models: models      # ./run.sh models downloads here
  runs: runs          # outputs, logs, progress
  code: code          # EAGLE-VLM code snapshot
  return: return      # ./run.sh collect writes the tarball to bring back here

python: python        # interpreter for the tasks (setup_env.sh prints it); must import torch+transformers(+peft)
gpus: all             # or a list, e.g. [0,1,2,3]
retries: 2            # a failed task is restarted (it resumes) up to this many times
backfill_minutes: 30  # idle GPUs run later tasks while a multi-GPU task waits, for at most this long
defaults: {bs: 8}

# name -> HF repo; gpus = GPUs per process (>1: device_map=auto); bs = batch; speed = est. calls/s per process at
# 768 px (only for ./run.sh plan); gen_tok_s = est. generated tokens/s per process; text_llm = text-only causal LM
models:
  qwen3vl2b:      {repo: Qwen/Qwen3-VL-2B-Instruct,      gpus: 1, bs: 16, speed: 45}
  qwen3vl4b:      {repo: Qwen/Qwen3-VL-4B-Instruct,      gpus: 1, bs: 16, speed: 35}
  qwen3vl8b:      {repo: Qwen/Qwen3-VL-8B-Instruct,      gpus: 1, bs: 8,  speed: 20, gen_tok_s: 1500}
  qwen3vl32b:     {repo: Qwen/Qwen3-VL-32B-Instruct,     gpus: 2, bs: 4,  speed: 5,  gen_tok_s: 400}
  qwen3vl8b_think: {repo: Qwen/Qwen3-VL-8B-Thinking,     gpus: 1, bs: 8,  speed: 20, gen_tok_s: 1500, thinking: true}
  qwen35_9b:      {repo: Qwen/Qwen3.5-9B,                gpus: 1, bs: 8,  speed: 18, gen_tok_s: 1300}
  qwen25vl3b:     {repo: Qwen/Qwen2.5-VL-3B-Instruct,    gpus: 1, bs: 16, speed: 35}
  qwen25vl7b:     {repo: Qwen/Qwen2.5-VL-7B-Instruct,    gpus: 1, bs: 8,  speed: 20}
  qwen25vl32b:    {repo: Qwen/Qwen2.5-VL-32B-Instruct,   gpus: 2, bs: 4,  speed: 5}
  qwen25vl72b:    {repo: Qwen/Qwen2.5-VL-72B-Instruct,   gpus: 4, bs: 4,  speed: 2}
  internvl35_1b:  {repo: OpenGVLab/InternVL3_5-1B-HF,    gpus: 1, bs: 16, speed: 45}
  internvl35_2b:  {repo: OpenGVLab/InternVL3_5-2B-HF,    gpus: 1, bs: 16, speed: 40}
  internvl35_4b:  {repo: OpenGVLab/InternVL3_5-4B-HF,    gpus: 1, bs: 16, speed: 30}
  internvl35_8b:  {repo: OpenGVLab/InternVL3_5-8B-HF,    gpus: 1, bs: 8,  speed: 20}
  internvl35_14b: {repo: OpenGVLab/InternVL3_5-14B-HF,   gpus: 1, bs: 8,  speed: 12}
  internvl35_38b: {repo: OpenGVLab/InternVL3_5-38B-HF,   gpus: 2, bs: 4,  speed: 5}
  # text-only LLM judges (text-domain counterpart; same prompts, same readout)
  qwen3_8b:       {repo: Qwen/Qwen3-8B,                  gpus: 1, bs: 16, speed: 40, gen_tok_s: 1800, text_llm: true}
  qwen3_32b:      {repo: Qwen/Qwen3-32B,                 gpus: 2, bs: 8,  speed: 10, text_llm: true}
  qwen25_7b:      {repo: Qwen/Qwen2.5-7B-Instruct,       gpus: 1, bs: 16, speed: 40, text_llm: true}
  qwen25_72b:     {repo: Qwen/Qwen2.5-72B-Instruct,      gpus: 4, bs: 8,  speed: 4,  text_llm: true}

# items/<name>.jsonl in data/. *_full = uncapped versions (more human ties / annotator splits); pp_full = tie-rich
# Place Pulse sample; text sets are kind=text (no images).
datasets: [pp, mmrb2, genai_arena, mllm_judge, editreward, vlrb, mmrb, mjbench, imagerewarddb, qbench2, mmrlhf]
dataset_sets:
  sub:  [pp, mmrb2, genai_arena, mllm_judge, editreward, vlrb, mmrb, mjbench, imagerewarddb, qbench2, mmrlhf]
  full: [pp_full, mmrb2, genai_arena_full, mllm_judge_full, editreward_full, imagerewarddb_full, mmrb_full,
         pp, vlrb, mjbench, qbench2, mmrlhf]
  text: [mtbench_human, arena55k]
  aleatoric: [pp_full, mmrb2, genai_arena_full, mllm_judge_full, editreward_full, imagerewarddb_full]

# Phases. ./run.sh start P1 P2 ... puts them in ONE priority queue (command-line order); idle GPUs are backfilled.
# Recommended order = scientific priority, so stopping at any time keeps the most important results.
phases:
  # ---------------------------------------------------------------- smoke tests (~20 min)
  smoke:
    type: judge
    conds: bin,tri,str7,score,tri_p1,tri_jpeg
    datasets: [pp_full, mmrb2, mllm_judge_full, mtbench_human]
    limit: 2
    shards: 1
    models: [qwen3vl2b, internvl35_1b, qwen25vl3b, qwen3_8b]
  smoke_big:
    type: judge
    conds: bin,tri
    datasets: [mmrb2, mllm_judge, mtbench_human]
    limit: 1
    shards: 1
    models: [qwen3vl32b, qwen25vl32b, internvl35_38b, qwen25vl72b, qwen3_32b, qwen25_72b]
  smoke_reason:
    type: reason
    datasets: [mmrb2, mtbench_human]
    limit: 2
    shards: 1
    n: 2
    max_new_tokens: 512
    models: [qwen3vl8b_think, qwen3_8b]
  D_smoke:
    type: train
    gpus_per_task: 1
    folds: [0]
    max_train: 16
    max_eval: 8
    datasets: [mmrb2, mllm_judge_full]
    models: [qwen3vl8b]

  # ---------------------------------------------------------------- P1 core: 4 base judges on the full sets
  core:
    type: judge
    conds: bin,tri,str7,score
    datasets: full
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]

  # ---------------------------------------------------------------- P2 text counterpart: is the gap specific to vision?
  text:
    type: judge
    conds: bin,tri,str7,score,tri_p1,tri_p2,tri_p3
    datasets: text
    models: [qwen3_8b, qwen25_7b, qwen3_32b, qwen25_72b, qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]

  # ---------------------------------------------------------------- P3 nuisance ensemble: epistemic = sensitivity to nuisance
  nuisance:
    type: judge
    conds: tri_p1,tri_p2,tri_p3,tri_jpeg,tri_crop
    datasets: full
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]

  # ---------------------------------------------------------------- P4 size ladder (3 families)
  scale_small:
    type: judge
    conds: bin,tri,str7,score
    datasets: full
    models: [qwen3vl2b, qwen3vl4b, qwen25vl3b, internvl35_1b, internvl35_2b, internvl35_4b, internvl35_14b]
  scale_big:
    type: judge
    conds: bin,tri,str7,score
    datasets: sub
    models: [qwen3vl32b, qwen25vl32b, internvl35_38b, qwen25vl72b]

  # ---------------------------------------------------------------- P5 reasoning + self-consistency (LLM-judge practice)
  reason:
    type: reason
    datasets: [aleatoric, vlrb, mmrb, text]
    n: 4
    max_new_tokens: 1536
    avg_tokens: 800
    models: [qwen3vl8b_think, qwen35_9b, qwen3_8b]
    # qwen35_9b and qwen3_8b reason with thinking on; qwen3_8b only sees the text sets
    thinking: true

  # ---------------------------------------------------------------- P6 hidden states for probes
  B:
    type: judge
    conds: bin,tri
    hidden: "0.25,0.5,0.75,1.0"
    datasets: full
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  B_big:
    type: judge
    conds: bin,tri
    hidden: "0.25,0.5,0.75,1.0"
    datasets: sub
    models: [qwen3vl32b, internvl35_38b]

  # ---------------------------------------------------------------- P7 LoRA: give the judge a trained "close" channel
  D:
    type: train
    gpus_per_task: 4
    folds: [0, 1]
    epochs: 1
    lr: 1.0e-4
    lora_r: 16
    bs: 2
    grad_accum: 4
    est_hours: 1.5
    datasets: full
    models: [qwen3vl8b, internvl35_8b]
  D_hard:                     # control: same training without ties / soft labels
    type: train
    gpus_per_task: 4
    folds: [0, 1]
    hard: 1
    tag: hard
    epochs: 1
    lr: 1.0e-4
    lora_r: 16
    bs: 2
    grad_accum: 4
    est_hours: 1.2
    datasets: full
    models: [qwen3vl8b, internvl35_8b]

  # ---------------------------------------------------------------- P8 more visual evidence
  C_hires:
    type: judge
    conds: bin_hires,tri
    tiling: true
    bs: 4
    cost: 4                   # 1536 px (+ InternVL tiling): several times the visual tokens (plan estimate only)
    datasets: sub
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  C_desc:
    type: describe
    max_new_tokens: 256
    datasets: sub
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  C_judge:
    type: judge
    conds: bin_desc
    desc_from: C_desc
    after: [C_desc]
    datasets: sub
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]

  # ---------------------------------------------------------------- backlog: runs only if the day is not used up
  scale_big_full:
    type: judge
    conds: bin,tri,str7,score
    datasets: [pp_full, mmrb2, genai_arena_full, mllm_judge_full, imagerewarddb_full]
    models: [qwen3vl32b, internvl35_38b, qwen25vl32b]
  reason_big:
    type: reason
    datasets: [aleatoric, text]
    n: 4
    max_new_tokens: 1536
    avg_tokens: 800
    thinking: true
    models: [qwen3vl32b]
