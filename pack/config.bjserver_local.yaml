# Local queue on bjserver (1x RTX PRO 6000), runs next to the phase-A chain (A_chain.sh). Single-GPU work only.
paths: {data: ., models: /nonexistent, runs: runs, code: /media/shawn/C/papers/EAGLE-VLM, return: return}
python: /home/shawn/anaconda3/envs/lis-omni/bin/python
gpus: [0]
slots_per_gpu: 1          # one queue task at a time; A_chain.sh is the second process on the GPU
retries: 2
backfill_minutes: 600     # the 32B task waits for A_DONE; everything else may run meanwhile
env: {PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}
defaults: {bs: 8}
models:   # speed = calls/s per process on bjserver while sharing the GPU with the phase-A job
  qwen3vl8b:     {repo: Qwen/Qwen3-VL-8B-Instruct, gpus: 1, bs: 8, speed: 8, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/Qwen3-VL-8B-Instruct}
  internvl35_8b: {repo: OpenGVLab/InternVL3_5-8B-HF, gpus: 1, bs: 8, speed: 8, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/InternVL3_5-8B-HF}
  qwen35_9b:     {repo: Qwen/Qwen3.5-9B, gpus: 1, bs: 8, speed: 7, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/Qwen3.5-9B}
  qwen25vl7b:    {repo: Qwen/Qwen2.5-VL-7B-Instruct, gpus: 1, bs: 8, speed: 6, path: /media/shawn/C/nyserver-files/mntstorage/models/Qwen2.5-VL-7B-Instruct}
  qwen25vl3b:    {repo: Qwen/Qwen2.5-VL-3B-Instruct, gpus: 1, bs: 16, speed: 12, path: /media/shawn/C/nyserver-files/mntstorage/models/Qwen2.5-VL-3B-Instruct}
  qwen3vl32b:    {repo: Qwen/Qwen3-VL-32B-Instruct, gpus: 1, bs: 4, speed: 1.6, exclusive: true, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/Qwen3-VL-32B-Instruct}
  qwen3_8b:      {repo: Qwen/Qwen3-8B, gpus: 1, bs: 16, speed: 25, text_llm: true, path: /home/shawn/code/Jev-Test/models/Qwen3-8B}
  qwen25_7b:     {repo: Qwen/Qwen2.5-7B-Instruct, gpus: 1, bs: 16, speed: 25, text_llm: true, path: /home/shawn/yinanshao/models/Qwen2.5-7B-Instruct}
datasets: [pp, mmrb2, genai_arena, mllm_judge, editreward, vlrb, mmrb, mjbench, imagerewarddb, qbench2, mmrlhf]
dataset_sets:
  text: [mtbench_human, arena55k]
  sub_aleatoric: [pp, mmrb2, genai_arena, mllm_judge, editreward, imagerewarddb]
  edit: [genai_arena_edit, mmrb2_edit, editreward]          # edit pairs with a source image (zoom conditions)
  resp_img: [mllm_judge, vlrb, mmrb, mmrlhf]                # text responses about images (image ablation)
  s32: [genai_arena_s32, mllm_judge_s32, editreward_s32, mmrb2_s32, imagerewarddb_s32, vlrb_s32, mmrb_s32, mjbench_s32]
phases:   # priority = order on the start command line
  # --- 2026-11-01 redesign after review (comments/1.md): is "can't tell" evidence the judge did not use? (targeted
  #     visual re-check vs random / same-pixel controls) and does the verdict use the image at all? (blind / wrong image).
  #     Human ties ("close") should keep P(T) under both.
  Z1_zoom_8b:
    type: judge
    conds: tri_zoom,tri_zoomr,tri_zoomlo
    datasets: edit
    cost: 1.6               # 6 images per call (plan estimate only)
    bs: 4                   # bs 8 hits the memory ceiling next to the phase-A job and thrashes on OOM
    models: [qwen3vl8b]
  Z2_ablate_8b:
    type: judge
    conds: tri_blind,tri_wrong
    datasets: resp_img
    cost: 0.7
    models: [qwen3vl8b]
  Z1_zoom_ivl:
    type: judge
    conds: tri_zoom,tri_zoomr,tri_zoomlo,tri_p1
    datasets: edit
    cost: 1.4
    bs: 4
    models: [internvl35_8b]
  Z2_ablate_ivl:
    type: judge
    conds: tri_blind,tri_wrong
    datasets: resp_img
    cost: 0.7
    models: [internvl35_8b]
  L1_text:
    type: judge
    conds: bin,tri,str7
    datasets: text
    cost: 0.5               # text items: no images, ~2x faster than the speed above (plan estimate only)
    models: [qwen3_8b, qwen25_7b, qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  L2_nuis_8b:
    type: judge
    conds: tri_p1,tri_p2,tri_p3
    datasets: sub_aleatoric
    models: [qwen3vl8b]
  L3_hidden_8b:
    type: judge
    conds: bin,tri
    hidden: "0.25,0.5,0.75,1.0"
    datasets: [sub_aleatoric, vlrb, mmrb]
    models: [qwen3vl8b]
  L4_scale_3b:
    type: judge
    conds: bin,tri
    datasets: all
    models: [qwen25vl3b]
  L5_nuis_ivl:
    type: judge
    conds: tri_p1,tri_p2,tri_p3
    datasets: sub_aleatoric
    models: [internvl35_8b]
  L6_32b_tri:
    type: judge
    conds: tri
    datasets: s32
    wait_for: {file: /media/shawn/C/papers/VLM/judgebench/logs/run_all.log, text: A_DONE}
    models: [qwen3vl32b]
  L7_imgnuis_8b:
    type: judge
    conds: tri_jpeg,tri_crop
    datasets: sub_aleatoric
    models: [qwen3vl8b]
  L8_imgnuis_ivl:
    type: judge
    conds: tri_jpeg,tri_crop
    datasets: sub_aleatoric
    models: [internvl35_8b]
