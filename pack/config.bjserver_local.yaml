# Local queue on bjserver (1x RTX PRO 6000), runs next to the phase-A chain (A_chain.sh). Single-GPU work only.
paths: {data: ., models: /nonexistent, runs: runs, code: /media/shawn/C/papers/EAGLE-VLM, return: return}
python: /home/shawn/anaconda3/envs/lis-omni/bin/python
gpus: [0]
slots_per_gpu: 1          # one queue task at a time; A_chain.sh is the second process on the GPU
retries: 2
backfill_minutes: 600     # the 32B task waits for A_DONE; everything else may run meanwhile
env: {PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}
defaults: {bs: 8}
models:   # speed = calls/s per process on bjserver while sharing the GPU with the phase-A job
  qwen3vl8b:     {repo: Qwen/Qwen3-VL-8B-Instruct, gpus: 1, bs: 8, speed: 8, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/Qwen3-VL-8B-Instruct}
  internvl35_8b: {repo: OpenGVLab/InternVL3_5-8B-HF, gpus: 1, bs: 8, speed: 8, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/InternVL3_5-8B-HF}
  qwen35_9b:     {repo: Qwen/Qwen3.5-9B, gpus: 1, bs: 8, speed: 7, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/Qwen3.5-9B}
  qwen25vl7b:    {repo: Qwen/Qwen2.5-VL-7B-Instruct, gpus: 1, bs: 8, speed: 6, path: /media/shawn/C/nyserver-files/mntstorage/models/Qwen2.5-VL-7B-Instruct}
  qwen25vl3b:    {repo: Qwen/Qwen2.5-VL-3B-Instruct, gpus: 1, bs: 16, speed: 12, path: /media/shawn/C/nyserver-files/mntstorage/models/Qwen2.5-VL-3B-Instruct}
  qwen3vl32b:    {repo: Qwen/Qwen3-VL-32B-Instruct, gpus: 1, bs: 4, speed: 1.6, exclusive: true, path: /media/shawn/C/papers/VLM/place-pulse-2.0/models/Qwen3-VL-32B-Instruct}
  r1reward:      {repo: yifanzhang114/R1-Reward, gpus: 1, bs: 8, speed: 6, path: /media/shawn/C/papers/VLM/judge_models/R1-Reward}
  llavacritic7b: {repo: lmms-lab/llava-critic-7b (converted to HF llava-onevision), gpus: 1, bs: 4, speed: 3, path: /media/shawn/C/papers/VLM/judge_models/llava-critic-7b-hf}
  mmrlhfrm7b:    {repo: yifanzhang114/MM-RLHF-Reward-7B-llava-ov-qwen (converted), gpus: 1, bs: 4, speed: 3, path: /media/shawn/C/papers/VLM/judge_models/MM-RLHF-Reward-7B-hf}
  llavaov7b:     {repo: llava-hf/llava-onevision-qwen2-7b-ov-hf (base of LLaVA-Critic and MM-RLHF-Reward), gpus: 1, bs: 4, speed: 3, path: /media/shawn/C/papers/VLM/judge_models/llava-ov-7b-hf}
  qwen3_8b:      {repo: Qwen/Qwen3-8B, gpus: 1, bs: 16, speed: 25, text_llm: true, path: /home/shawn/code/Jev-Test/models/Qwen3-8B}
  qwen25_7b:     {repo: Qwen/Qwen2.5-7B-Instruct, gpus: 1, bs: 16, speed: 25, text_llm: true, path: /home/shawn/yinanshao/models/Qwen2.5-7B-Instruct}
datasets: [pp, mmrb2, genai_arena, mllm_judge, editreward, vlrb, mmrb, mjbench, imagerewarddb, qbench2, mmrlhf]
dataset_sets:
  text: [mtbench_human, arena55k]
  sub_aleatoric: [pp, mmrb2, genai_arena, mllm_judge, editreward, imagerewarddb]
  edit: [genai_arena_edit, mmrb2_edit, editreward]          # edit pairs with a source image (zoom conditions)
  resp_img: [mllm_judge, vlrb, mmrb, mmrlhf]                # text responses about images (image ablation)
  ties: [genai_arena, mllm_judge, editreward, pp]            # sets with human ties (baseline table)
  ver_small: [mmrb2_s32, vlrb_s32, mmrb_s32, mjbench_s32, imagerewarddb_s32, qbench2_s32, mmrlhf_s32]   # verified sets, 700-pair caps
  s32: [genai_arena_s32, mllm_judge_s32, editreward_s32, mmrb2_s32, imagerewarddb_s32, vlrb_s32, mmrb_s32, mjbench_s32]
phases:   # priority = order on the start command line
  # --- 2026-11-02 levels of judge failure (evidence acquisition / localisation / weighting) and hidden-state probes.
  #     E1: perception check of the single differing visual fact of each controlled pair (with / without image).
  #     E2: the same pairs with the difference pointed out.  C1: real pairs, LLM-extracted differing claims, checked by
  #     the judges.  H1/H2: verdict-position hidden states (8 / 4 layer fractions) for cross-architecture probes.
  E1_perc:
    type: judge
    conds: bin,bin_blind
    datasets: [synth_perc]
    cost: 0.4
    models: [qwen3vl8b, internvl35_8b, qwen25vl7b, r1reward, llavaov7b, llavacritic7b, mmrlhfrm7b, qwen35_9b]
  E2_loc:
    type: judge
    conds: bin,tri
    datasets: [synth_loc]
    models: [qwen3vl8b, internvl35_8b, qwen25vl7b, r1reward, llavaov7b, llavacritic7b, mmrlhfrm7b, qwen35_9b]
  C1_claims:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judgebench_local/runs/claim_diff.log, text: CLAIMS_DONE}
    conds: bin,bin_blind
    datasets: [claim_check]
    cost: 0.4
    models: [qwen3vl8b, internvl35_8b, qwen25vl7b, llavaov7b]
  H1_synth_hidden:
    type: judge
    conds: bin,tri
    hidden: "0.125,0.25,0.375,0.5,0.625,0.75,0.875,1.0"
    datasets: [synth_tie, synth_perc]
    models: [qwen3vl8b, internvl35_8b, llavaov7b, qwen25vl7b, r1reward]
  H3_synth_blind_hidden:   # surface-text control for the synth probes: same pairs, no image
    type: judge
    conds: bin_blind,tri_blind
    hidden: "0.125,0.25,0.375,0.5,0.625,0.75,0.875,1.0"
    datasets: [synth_tie]
    models: [qwen3vl8b, internvl35_8b]
  H4_ft_hidden:            # does judge fine-tuning lose verdict info at readout? (R1: hidden .95 vs output .83 on DV)
    type: judge
    conds: bin,tri
    hidden: "0.125,0.25,0.375,0.5,0.625,0.75,0.875,1.0"
    datasets: [synth_tie]
    models: [llavacritic7b, mmrlhfrm7b, qwen35_9b]
  H2_real_hidden:
    type: judge
    conds: bin,tri
    hidden: "0.25,0.5,0.75,1.0"
    datasets: [genai_arena, mllm_judge]
    models: [internvl35_8b, qwen25vl7b, llavaov7b, r1reward]
  # --- 2026-11-02 tie mechanism: P(T) on GenAI-Arena tracks 'both bad' votes, not 'equally good' ones.
  #     S1: controlled set (make_synth_ties.py): TG both-good tie / TB both-bad tie / DV visual-detail win / DT text-flaw win,
  #         with and without the image.  T1: text pairs with both tie types (Arena 100k).  J4: base of LLaVA-Critic/MM-RLHF.
  S1_synth:
    type: judge
    conds: bin,tri,bin_blind,tri_blind
    datasets: [synth_tie]
    models: [qwen3vl8b, r1reward, qwen25vl7b, internvl35_8b, llavacritic7b, mmrlhfrm7b]
  T1_arena_tt:
    type: judge
    conds: bin,tri
    datasets: [arena_tt]
    cost: 0.6
    models: [qwen3_8b, qwen3vl8b, qwen25vl7b, r1reward, qwen25_7b, internvl35_8b]
  J4_llavaov:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judge_models/dl2.log, text: DL2_DONE}
    conds: bin,tri
    datasets: ties
    cost: 2.0
    models: [llavaov7b]
  S1_synth_ov:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judge_models/dl2.log, text: DL2_DONE}
    conds: bin,tri,bin_blind,tri_blind
    datasets: [synth_tie]
    models: [llavaov7b]
  S2_synth_q35:          # 2026-11-02: Qwen3.5-9B missing from S1_synth (levels / synth tables)
    type: judge
    conds: bin,tri,bin_blind,tri_blind
    datasets: [synth_tie]
    models: [qwen35_9b]
  # --- 2026-11-01 redesign after review (comments/1.md): is "can't tell" evidence the judge did not use? (targeted
  #     visual re-check vs random / same-pixel controls) and does the verdict use the image at all? (blind / wrong image).
  #     Human ties ("close") should keep P(T) under both.
  Z1_zoom_8b:
    type: judge
    conds: tri_zoom,tri_zoomr,tri_zoomlo
    datasets: edit
    cost: 1.6               # 6 images per call (plan estimate only)
    bs: 4                   # bs 8 hits the memory ceiling next to the phase-A job and thrashes on OOM
    models: [qwen3vl8b]
  Z2_ablate_8b:
    type: judge
    conds: tri_blind,tri_wrong
    datasets: resp_img
    cost: 0.7
    models: [qwen3vl8b]
  Z1_zoom_ivl:
    type: judge
    conds: tri_zoom,tri_zoomr,tri_zoomlo,tri_p1
    datasets: edit
    cost: 1.4
    bs: 4
    models: [internvl35_8b]
  Z2_ablate_ivl:
    type: judge
    conds: tri_blind,tri_wrong
    datasets: resp_img
    cost: 0.7
    models: [internvl35_8b]
  # --- 2026-11-01 night: LLM-judge methods not yet tried on VLM judges. Zero-shot simulated annotators (persona
  #     ensemble, Jung et al. ICLR 2025 "Trust or Escalate"): agreement across personas as confidence, mean P(T) as tie.
  # --- dedicated multimodal judge / reward models from the MLLM-as-a-Judge line (baselines for the main table),
  #     read with the same pairwise protocol: forced choice (bin) and tie option (tri), both orders.
  J1_r1reward:
    type: judge
    conds: bin,tri
    datasets: ties
    models: [r1reward]
  J1_r1reward_ver:
    type: judge
    conds: bin
    datasets: ver_small
    models: [r1reward]
  J2_critic:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judge_models/llava-critic-7b-hf/CONVERTED, text: ok}
    conds: bin,tri
    datasets: ties
    cost: 2.0
    models: [llavacritic7b]
  J2_critic_ver:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judge_models/llava-critic-7b-hf/CONVERTED, text: ok}
    conds: bin
    datasets: ver_small
    cost: 2.0
    models: [llavacritic7b]
  J3_mmrlhf:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judge_models/MM-RLHF-Reward-7B-hf/CONVERTED, text: ok}
    conds: bin,tri
    datasets: ties
    cost: 2.0
    models: [mmrlhfrm7b]
  J3_mmrlhf_ver:
    type: judge
    wait_for: {file: /media/shawn/C/papers/VLM/judge_models/MM-RLHF-Reward-7B-hf/CONVERTED, text: ok}
    conds: bin
    datasets: ver_small
    cost: 2.0
    models: [mmrlhfrm7b]
  L9_simann_8b:
    type: judge
    conds: tri_sa1,tri_sa2,tri_sa3,tri_sa4
    datasets: ties
    models: [qwen3vl8b]
  L9_simann_ivl:
    type: judge
    conds: tri_sa1,tri_sa2,tri_sa3,tri_sa4
    datasets: ties
    models: [internvl35_8b]
  L1_text:
    type: judge
    conds: bin,tri,str7
    datasets: text
    cost: 0.5               # text items: no images, ~2x faster than the speed above (plan estimate only)
    models: [qwen3_8b, qwen25_7b, qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  L2_nuis_8b:
    type: judge
    conds: tri_p1,tri_p2,tri_p3
    datasets: sub_aleatoric
    models: [qwen3vl8b]
  L3_hidden_8b:
    type: judge
    conds: bin,tri
    hidden: "0.25,0.5,0.75,1.0"
    datasets: [sub_aleatoric, vlrb, mmrb]
    models: [qwen3vl8b]
  L4_scale_3b:
    type: judge
    conds: bin,tri
    datasets: all
    models: [qwen25vl3b]
  L5_nuis_ivl:
    type: judge
    conds: tri_p1,tri_p2,tri_p3
    datasets: sub_aleatoric
    models: [internvl35_8b]
  L6_32b_tri:
    type: judge
    conds: tri
    datasets: s32
    wait_for: {file: /media/shawn/C/papers/VLM/judgebench/logs/run_all.log, text: A_DONE}
    models: [qwen3vl32b]
  L7_imgnuis_8b:
    type: judge
    conds: tri_jpeg,tri_crop
    datasets: sub_aleatoric
    models: [qwen3vl8b]
  L8_imgnuis_ivl:
    type: judge
    conds: tri_jpeg,tri_crop
    datasets: sub_aleatoric
    models: [internvl35_8b]
  # --- 2026-11-03 VLM vs LLM judge differences for selective judging (Trust-or-Escalate style).
  #     P1: position bias with image candidates: identical candidates (pure position prior), the two candidates composed
  #     into one side-by-side image, and low resolution.  P2: the same pure prior on text-answer and text-only sets.
  #     P3: text LLM judges, pure prior on text sets.  Z3: image ablation for the two remaining general judges.
  P1_posbias_img:
    type: judge
    conds: bin_same,bin_grid,bin_lowres
    datasets: [genai_arena, mjbench, imagerewarddb, mmrb2, qbench2, editreward]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  P2_posbias_txt:
    type: judge
    conds: bin_same
    datasets: [vlrb, mmrb, mllm_judge, mtbench_human, arena55k]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  P3_posbias_llm:
    type: judge
    conds: bin_same
    datasets: [mtbench_human, arena55k]
    models: [qwen3_8b, qwen25_7b]
  Z3_ablate_rest:
    type: judge
    conds: tri_blind,tri_wrong
    datasets: resp_img
    models: [qwen35_9b, qwen25vl7b]
  # --- 2026-11-03 position-bias controls: letter vs slot (relabel), instruction before the images (qfirst); 32B scale check.
  P4_posbias_ctrl:
    type: judge
    conds: bin_relabel,bin_qfirst
    datasets: [genai_arena, mjbench, imagerewarddb, mmrb2, qbench2, editreward]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  P5_posbias_32b:
    type: judge
    conds: bin_same,bin_relabel,bin_qfirst
    datasets: [genai_arena_s32, mjbench_s32, imagerewarddb_s32, mmrb2_s32]
    models: [qwen3vl32b]
  # --- 2026-11-03 tie storyline scale check: 32B on the full tie-bearing sets (bin + tri, both orders)
  T2_32b_tie:
    type: judge
    conds: bin,tri
    datasets: [genai_arena, genai_arena_rest, pp, mllm_judge, mtbench_human, arena55k, arena55k_rest]
    models: [qwen3vl32b]
  # --- 2026-11-03 full / natural-rate data for the main tie tables (items from scripts/make_rest.py)
  N1_full_vlm:
    type: judge
    conds: bin,tri
    datasets: [genai_arena_rest, arena55k_rest]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  N1_full_llm:
    type: judge
    conds: bin,tri
    datasets: [arena55k_rest]
    models: [qwen3_8b, qwen25_7b]
  # --- 2026-11-03 modality-controlled test: same image pairs judged from fixed text descriptions (scripts/caption_cands.py)
  C2_capjudge_vlm:
    type: judge
    conds: bin,tri
    datasets: [genai_arena_cap, imagerewarddb_cap, pp_cap]
    models: [qwen3vl8b, internvl35_8b]
  C2_capjudge_llm:
    type: judge
    conds: bin,tri
    datasets: [genai_arena_cap, imagerewarddb_cap, pp_cap]
    models: [qwen3_8b]
  # --- 2026-11-03 evening: natural-rate tie-bearing extensions of mainstream multimodal judge sets (scripts/make_rest2.py)
  N2_ext_vlm:
    type: judge
    conds: bin,tri
    datasets: [pickapic, imagerewarddb_rest, mllm_judge_rest]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  N2_ext_32b:
    type: judge
    conds: bin,tri
    datasets: [pickapic, imagerewarddb, imagerewarddb_rest, mllm_judge_rest]
    models: [qwen3vl32b]
  # --- complete benchmarks (scripts/make_rest3.py): base + rest + rest2 = all of ImageRewardDB pairs / MLLM-as-a-Judge
  N3_rest2_vlm:
    type: judge
    conds: bin,tri
    datasets: [imagerewarddb_rest2, mllm_judge_rest2]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  N3_rest2_32b:
    type: judge
    conds: bin,tri
    datasets: [imagerewarddb_rest2, mllm_judge_rest2]
    models: [qwen3vl32b]
  # --- 2026-11-03 night: pointwise absolute quality per candidate (1-9), for routing ambiguous pairs to pointwise
  #     ("both bad" is invisible to a pairwise preference); absolute prompts SCORE_IMG / SCORE_EDIT / SCORE_RESP
  W1_point_vlm:
    type: judge
    conds: score
    datasets: [genai_arena, genai_arena_rest, pickapic, imagerewarddb, imagerewarddb_rest, imagerewarddb_rest2, mllm_judge, mllm_judge_rest, mllm_judge_rest2]
    models: [qwen3vl8b, internvl35_8b]
  W1_point_32b:
    type: judge
    conds: score
    datasets: [genai_arena, genai_arena_rest, pickapic, imagerewarddb, imagerewarddb_rest, imagerewarddb_rest2, mllm_judge, mllm_judge_rest, mllm_judge_rest2]
    models: [qwen3vl32b]
  # --- Pick-a-Pic standard eval splits (test_unique + validation_unique; scripts/make_pickapic_u.py)
  N4_pu_vlm:
    type: judge
    conds: bin,tri,score
    datasets: [pickapic_u]
    models: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b]
  N4_pu_32b:
    type: judge
    conds: bin,tri,score
    datasets: [pickapic_u]
    models: [qwen3vl32b]
  # --- 2026-11-04: trained-judge baselines (R1-Reward ICLR26, LLaVA-Critic CVPR25) on the full tie-bearing sets;
  #     pointwise + blind completion for the remaining VLMs
  J6_judges_full:
    type: judge
    conds: bin,tri
    datasets: [mllm_judge, mllm_judge_rest, mllm_judge_rest2, genai_arena, genai_arena_rest, pickapic_u, imagerewarddb, imagerewarddb_rest, imagerewarddb_rest2]
    models: [r1reward, llavacritic7b]
  W2_point_rest:
    type: judge
    conds: score
    datasets: [mllm_judge, mllm_judge_rest, mllm_judge_rest2, genai_arena, genai_arena_rest, pickapic_u, imagerewarddb, imagerewarddb_rest, imagerewarddb_rest2]
    models: [qwen35_9b, qwen25vl7b]
  B1_blind_rest:
    type: judge
    conds: bin_blind,tri_blind
    datasets: [mllm_judge, mllm_judge_rest, mllm_judge_rest2]
    models: [qwen35_9b, qwen25vl7b]
  # --- 2026-11-05: tie-prompt paraphrases (phenomenon 1 robustness) + LLaVA-OV base as the control for LLaVA-Critic
  B2_para_rest:
    type: judge
    conds: tri_p1,tri_p2,tri_p3
    datasets: [mllm_judge, mllm_judge_rest, mllm_judge_rest2, genai_arena, genai_arena_rest]
    models: [qwen35_9b, qwen25vl7b]
  J7_llavaov_full:
    type: judge
    conds: bin,tri
    datasets: [mllm_judge, mllm_judge_rest, mllm_judge_rest2, genai_arena, genai_arena_rest, pickapic_u, imagerewarddb, imagerewarddb_rest, imagerewarddb_rest2]
    models: [llavaov7b]
  # --- 2026-11-05: MLLM-as-a-Judge SCORE split made pairwise (human 1-5 per answer; scripts/make_mj_scorepairs.py)
  SP_scorepairs:
    type: judge
    conds: bin,tri,score
    datasets: [mllm_judge_sp]
    models: [qwen3vl8b, internvl35_8b]
  # --- 2026-11-05: resolution ablation - items with an image > 768 px, judged at full resolution (long side <= 1536);
  #     the 768-px reference outputs already exist under the base dataset names
  R1_hires:
    type: judge
    conds: bin_hires,tri_hires,score_hires
    datasets: [mllm_judge_big, mllm_judge_sp_big, genai_arena_big, imagerewarddb_big]
    models: [qwen3vl8b]
