# EAGLE-V config for 8x RTX PRO 6000 Blackwell (96 GB). Generated from config.yaml:
#  - speeds = bjserver measurements (same card): config.yaml speeds / 1.3; generation / 1.8; LoRA est. x2
#  - 96 GB: InternVL3.5-38B on one GPU, 72B models on two GPUs
# Use:  cp config.pro6000.yaml config.yaml   (or ./run.sh --config config.pro6000.yaml ... via CTL)
paths:
  data: data
  models: models
  runs: runs
  code: code
  return: return
python: python
gpus: all
retries: 2
backfill_minutes: 30
slots_per_gpu: 2
defaults:
  bs: 8
models:
  qwen3vl2b:
    repo: Qwen/Qwen3-VL-2B-Instruct
    gpus: 1
    bs: 16
    speed: 19.2
  qwen3vl4b:
    repo: Qwen/Qwen3-VL-4B-Instruct
    gpus: 1
    bs: 16
    speed: 15.4
  qwen3vl8b:
    repo: Qwen/Qwen3-VL-8B-Instruct
    gpus: 1
    bs: 8
    speed: 10.0
    gen_tok_s: 388
  qwen3vl32b:
    repo: Qwen/Qwen3-VL-32B-Instruct
    gpus: 1
    bs: 4
    speed: 2.3
    gen_tok_s: 166
    exclusive: true
  qwen3vl8b_think:
    repo: Qwen/Qwen3-VL-8B-Thinking
    gpus: 1
    bs: 8
    speed: 10.0
    gen_tok_s: 388
    thinking: true
  qwen35_9b:
    repo: Qwen/Qwen3.5-9B
    gpus: 1
    bs: 8
    speed: 9.2
    gen_tok_s: 333
  qwen25vl3b:
    repo: Qwen/Qwen2.5-VL-3B-Instruct
    gpus: 1
    bs: 16
    speed: 15.4
  qwen25vl7b:
    repo: Qwen/Qwen2.5-VL-7B-Instruct
    gpus: 1
    bs: 8
    speed: 10.0
  qwen25vl32b:
    repo: Qwen/Qwen2.5-VL-32B-Instruct
    gpus: 1
    bs: 4
    speed: 2.3
    exclusive: true
  qwen25vl72b:
    repo: Qwen/Qwen2.5-VL-72B-Instruct
    gpus: 2
    bs: 4
    speed: 0.9
  internvl35_1b:
    repo: OpenGVLab/InternVL3_5-1B-HF
    gpus: 1
    bs: 16
    speed: 19.2
  internvl35_2b:
    repo: OpenGVLab/InternVL3_5-2B-HF
    gpus: 1
    bs: 16
    speed: 16.9
  internvl35_4b:
    repo: OpenGVLab/InternVL3_5-4B-HF
    gpus: 1
    bs: 16
    speed: 13.8
  internvl35_8b:
    repo: OpenGVLab/InternVL3_5-8B-HF
    gpus: 1
    bs: 8
    speed: 9.2
  internvl35_14b:
    repo: OpenGVLab/InternVL3_5-14B-HF
    gpus: 1
    bs: 8
    speed: 5.4
  internvl35_38b:
    repo: OpenGVLab/InternVL3_5-38B-HF
    gpus: 1
    bs: 4
    speed: 1.6
    exclusive: true
  qwen3_8b:
    repo: Qwen/Qwen3-8B
    gpus: 1
    bs: 16
    speed: 23.1
    gen_tok_s: 444
    text_llm: true
  qwen3_32b:
    repo: Qwen/Qwen3-32B
    gpus: 1
    bs: 8
    speed: 6.2
    text_llm: true
    exclusive: true
  qwen25_7b:
    repo: Qwen/Qwen2.5-7B-Instruct
    gpus: 1
    bs: 16
    speed: 23.1
    text_llm: true
  qwen25_72b:
    repo: Qwen/Qwen2.5-72B-Instruct
    gpus: 2
    bs: 8
    speed: 1.8
    text_llm: true
datasets:
- pp
- mmrb2
- genai_arena
- mllm_judge
- editreward
- vlrb
- mmrb
- mjbench
- imagerewarddb
- qbench2
- mmrlhf
dataset_sets:
  sub:
  - pp
  - mmrb2
  - genai_arena
  - mllm_judge
  - editreward
  - vlrb
  - mmrb
  - mjbench
  - imagerewarddb
  - qbench2
  - mmrlhf
  full:
  - pp_full
  - mmrb2
  - genai_arena_full
  - mllm_judge_full
  - editreward_full
  - imagerewarddb_full
  - mmrb_full
  - pp
  - vlrb
  - mjbench
  - qbench2
  - mmrlhf
  text:
  - mtbench_human
  - arena55k
  aleatoric:
  - pp_full
  - mmrb2
  - genai_arena_full
  - mllm_judge_full
  - editreward_full
  - imagerewarddb_full
  sub_aleatoric:
  - pp
  - mmrb2
  - genai_arena
  - mllm_judge
  - editreward
  - imagerewarddb
phases:
  smoke:
    type: judge
    conds: bin,tri,str7,score,tri_p1,tri_jpeg
    datasets:
    - pp_full
    - mmrb2
    - mllm_judge_full
    - mtbench_human
    limit: 2
    shards: 1
    models:
    - qwen3vl2b
    - internvl35_1b
    - qwen25vl3b
    - qwen3_8b
  smoke_big:
    type: judge
    conds: bin,tri
    datasets:
    - mmrb2
    - mllm_judge
    - mtbench_human
    limit: 1
    shards: 1
    models:
    - qwen3vl32b
    - qwen25vl32b
    - internvl35_38b
    - qwen25vl72b
    - qwen3_32b
    - qwen25_72b
  smoke_reason:
    type: reason
    datasets:
    - mmrb2
    - mtbench_human
    limit: 2
    shards: 1
    n: 2
    max_new_tokens: 512
    models:
    - qwen3vl8b_think
    - qwen3_8b
  D_smoke:
    type: train
    gpus_per_task: 1
    folds:
    - 0
    max_train: 16
    max_eval: 8
    datasets:
    - mmrb2
    - mllm_judge_full
    models:
    - qwen3vl8b
  core:
    type: judge
    conds: bin,tri,str7,score
    datasets: full
    models:
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  text:
    type: judge
    conds: bin,tri,str7,score,tri_p1,tri_p2,tri_p3
    datasets: text
    models:
    - qwen3_8b
    - qwen25_7b
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  text_big:
    type: judge
    conds: bin,tri,str7
    datasets: text
    models:
    - qwen3_32b
    - qwen25_72b
  nuisance:
    type: judge
    conds: tri_p1,tri_p2,tri_p3,tri_jpeg,tri_crop
    datasets: full
    models:
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  scale_small:
    type: judge
    conds: bin,tri,str7,score
    datasets: full
    models:
    - qwen3vl2b
    - qwen3vl4b
    - qwen25vl3b
    - internvl35_1b
    - internvl35_2b
    - internvl35_4b
    - internvl35_14b
  scale_big:
    type: judge
    conds: bin,tri
    datasets: sub
    models:
    - qwen3vl32b
    - qwen25vl32b
    - internvl35_38b
    - qwen25vl72b
  reason:
    type: reason
    datasets:
    - sub_aleatoric
    - text
    n: 4
    max_new_tokens: 1536
    avg_tokens: 900
    thinking: true
    models:
    - qwen3vl8b_think
    - qwen35_9b
    - qwen3_8b
  B:
    type: judge
    conds: bin,tri
    hidden: 0.25,0.5,0.75,1.0
    datasets: full
    models:
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  B_big:
    type: judge
    conds: bin,tri
    hidden: 0.25,0.5,0.75,1.0
    datasets: sub
    models:
    - qwen3vl32b
  D:
    type: train
    gpus_per_task: 4
    folds:
    - 0
    - 1
    epochs: 1
    lr: 0.0001
    lora_r: 16
    bs: 2
    grad_accum: 4
    est_hours: 2.0
    datasets: full
    models:
    - qwen3vl8b
    - internvl35_8b
  D_hard:
    type: train
    gpus_per_task: 4
    folds:
    - 0
    - 1
    hard: 1
    tag: hard
    epochs: 1
    lr: 0.0001
    lora_r: 16
    bs: 2
    grad_accum: 4
    est_hours: 1.8
    datasets: full
    models:
    - qwen3vl8b
  C_hires:
    type: judge
    conds: bin_hires,tri
    tiling: true
    bs: 4
    cost: 4
    datasets: sub
    models:
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  C_desc:
    type: describe
    max_new_tokens: 256
    datasets: sub
    models:
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  C_judge:
    type: judge
    conds: bin_desc
    desc_from: C_desc
    after:
    - C_desc
    datasets: sub
    models:
    - qwen3vl8b
    - internvl35_8b
    - qwen35_9b
    - qwen25vl7b
  scale_big_more:
    type: judge
    conds: str7,score
    datasets: sub
    models:
    - qwen3vl32b
    - qwen25vl32b
    - internvl35_38b
    - qwen25vl72b
  scale_big_full:
    type: judge
    conds: bin,tri
    datasets:
    - pp_full
    - genai_arena_full
    - mllm_judge_full
    - imagerewarddb_full
    models:
    - qwen3vl32b
    - qwen25vl32b
  reason_big:
    type: reason
    datasets:
    - sub_aleatoric
    n: 2
    max_new_tokens: 1536
    avg_tokens: 700
    models:
    - qwen3vl32b
