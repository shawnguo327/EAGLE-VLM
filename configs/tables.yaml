  arena55k: Chatbot Arena (text)
  polaris: Polaris
  agiqa3k: AGIQA-3K
latex_tasks:
  mllm_judge: VQA answers
  mllm_judge_sp: VQA answers
  visionarena: VLM chat answers
  genaibench: text-to-image
  evalmuse: text-to-image
  imagenhub/t2i: text-to-image
  imagenhub/edit: image editing
  genai_arena/generation: text-to-image
  genai_arena/edition: image editing
  pickapic_u: text-to-image
  imagerewarddb: text-to-image
  mtbench_human: chat (text)
  arena55k: chat (text)
  polaris: captioning
  agiqa3k: text-to-image
latex_main_sets: [mllm_judge, mllm_judge_sp, genaibench, genai_arena/generation, genai_arena/edition, mtbench_human]
latex_methods:
  - [P1, 'SCOPE~\cite{badshah2026scope}']
  - [T1, 'ToE~\cite{jung2024trust}']
