# Review W1: Trust-or-Escalate with its few-shot simulated annotators (judge_bench conditions bin_fs1..3: N = 3 annotators,
# each K = 3 human-labelled demonstrations in the query format; confidence max_y of the annotators' mean probability), as
# published (T4: calibration without ties) and with ties kept (T5), next to SCOPE, the zero-shot persona adaptation and
# ours, at the source level.  Runs once the bjserver queue (T3a_toe_fewshot) has produced the few-shot outputs.
name: certify_toe_fewshot
type: certify
include: ../paths.bjserver.yaml
datasets: [mllm_judge, mllm_judge_sp, mtbench_human, arena55k]
judges: [qwen3vl8b, internvl35_8b]
methods: [P1, T1, T2, T4, T5, G2, G5]
fewshot_items_dirs: [/media/shawn/C/papers/VLM/judgebench_local/items]
alphas: [0.1, 0.2, 0.3]
delta: 0.1
unit: source1
split: {fit: 0.25, cal: 0.5}
n_splits: 100
min_coverage: 0.95
