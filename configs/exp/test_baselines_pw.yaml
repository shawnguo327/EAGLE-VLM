# Novelty review (11-07, E3): pointwise baselines on the main source-level protocol, every method on the same items (those
# with every pointwise score; the share dropped is logged).  PWT: always-answer pointwise tie band; PWL: pointwise strict
# claims with LTT; PWTL / PWTH: PWT's band fitted on the fit split and certified with LTT (own margin / shared calibrator);
# G2pw / P4pw: graded / strict claims from the calibrator with the same pointwise features; pairwise-only rows for reference.
name: test_baselines_pw
type: certify
include: ../paths.bjserver.yaml
datasets: [genaibench]
judges: [qwen3vl8b]
methods: [G2, G2s, G2pw, AMX, TC, TCL, TCH, PWT, PWL, PWTL, PWTH, P4, P4pw]
alphas: [0.2]
delta: 0.1
unit: source1
split: {fit: 0.25, cal: 0.5}
n_splits: 3
min_coverage: 0.95
pointwise: true
require_pointwise: true
