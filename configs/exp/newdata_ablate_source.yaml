# New benchmarks as their judge runs arrive (ImagenHub, VisionArena-Battle, EvalMuse-40K): the same analysis as ablate_source, written to
# results/newdata_ablate_source so the paper's main tables stay fixed until every judge is in (judges with < 95% of the items are skipped).
name: newdata_ablate_source
type: ablate
include: ../paths.bjserver.yaml
datasets: [imagenhub/t2i, imagenhub/edit, visionarena, evalmuse]
judges: [qwen3vl8b, internvl35_8b, qwen35_9b, qwen25vl7b, qwen3vl32b]
alphas: [0.1, 0.2, 0.3]
delta: 0.1
unit: source1
split: {fit: 0.25, cal: 0.5}      # of the sources; test = the remaining quarter (all its pairs)
n_splits: 100
bootstrap: 2000
min_coverage: 0.95
