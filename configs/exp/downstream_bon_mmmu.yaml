# Downstream (Section 9): judges on Best-of-8 candidate pairs.  MMMU_DEV_VAL, all 1,050 questions; candidates from the
# official VLMEvalKit InternVL2_5-8B-BoN-8 run (InternVL2.5-8B samples, VisualPRM-8B selection), 8 cyclic pairs per question
# (scripts/bon/make_bon_items.py); label from VLMEvalKit correctness: correct > wrong, both correct / both wrong = tie.
# Same methods as certify_main except Trust-or-Escalate (its persona prompts were not run on these pairs).  Unit: the
# question (review W5 / improvement plan): the split is drawn over questions and calibration uses ONE random pair per
# calibration question, so the calibration units are independent and the binomial LTT is exact for the risk of a pair
# drawn uniformly from a uniformly drawn new question.
name: downstream_bon_mmmu
type: certify
include: ../paths.bjserver.yaml
datasets: [bon_mmmu]
judges: [qwen3vl8b, internvl35_8b, qwen35_9b]
methods: [P1, P1s, P2, P3, P4, TC, G0, G1, G2, G3, G4, G5, G2pw, G5pw]
alphas: [0.1, 0.2, 0.3]
delta: 0.1
unit: source1
group: meta.question_index
split: {fit: 0.25, cal: 0.5}       # of the questions; test = the remaining quarter (all its pairs)
n_splits: 100
min_coverage: 0.95
